import java.nio.file.Paths

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.kellehs.wellness.wear'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kellehs.wellness'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // EAS injects its signing config into the :app module only (see
    // @expo/build-tools EasBuildInjectAndroidCredentialsGradle). Without the
    // equivalent here, :wear:packageRelease emits an UNSIGNED apk, which then
    // gets embedded into the phone apk and fails to sideload with
    // INSTALL_PARSE_FAILED_NO_CERTIFICATES. It must be the *same* certificate as
    // the phone app: the Wearable Data Layer only talks between apps sharing a
    // package name and signing cert, so signing this with a debug key would
    // install cleanly but silently break phone<->watch sync.
    signingConfigs {
        release {
            def easWorkingdir = System.getenv('EAS_BUILD_WORKINGDIR')
            if (easWorkingdir != null) {
                def credentialsJson = Paths.get(easWorkingdir).resolve('credentials.json').toFile()
                if (credentialsJson.exists()) {
                    def credentials = new groovy.json.JsonSlurper().parse(credentialsJson)
                    storeFile Paths.get(credentials.android.keystore.keystorePath).toFile()
                    storePassword credentials.android.keystore.keystorePassword
                    keyAlias credentials.android.keystore.keyAlias
                    if (credentials.android.keystore.containsKey('keyPassword')) {
                        keyPassword credentials.android.keystore.keyPassword
                    } else {
                        // PKCS keystores have no key password; Gradle still requires one
                        keyPassword credentials.android.keystore.keystorePassword
                    }
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Left unsigned outside EAS (e.g. plain `expo run:android`), where no
            // credentials.json exists — assigning an empty config fails the build.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.wear:wear:1.3.0'

    // Tiles + ProtoLayout (declarative Wear OS tile UI)
    implementation 'androidx.wear.tiles:tiles:1.4.0'
    implementation 'androidx.wear.tiles:tiles-material:1.4.0'
    implementation 'androidx.wear.protolayout:protolayout:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.2.0'

    // Wearable Data Layer (phone ↔ watch sync)
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    implementation 'com.google.guava:guava:32.1.3-android'
}
